[project]
name = "ap-merin-web"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<4",
  "flask-cors>=5,<7",
  "Werkzeug>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
  "pandas>=2.2,<3",
  "google-genai>=1,<3",
  "Pillow>=11,<13",
  "cryptography>=44",
  "tzdata>=2025.1",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python prepare_web_assets.py"
